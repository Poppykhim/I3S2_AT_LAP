name: Lab 02 Automation

on:
  push:
    paths:
      - "Lab02/**"

jobs:
  test-lab02:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Compile and Run Java Tests
        working-directory: ./Lab02
        run: |
          mkdir -p bin
          # Compile using : as classpath separator on Linux
          javac -d bin -cp "lib/*:src" src/lab02/*.java test/lab02/*.java

          # Run Tests
          java -jar lib/junit-platform-console-standalone-1.13.0-M3.jar --class-path bin --scan-class-path
